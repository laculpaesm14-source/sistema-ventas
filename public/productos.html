<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Sistema de Ventas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Sistema de Ventas</div>
      <nav class="nav">
        <a href="index.html" class="">Inicio</a>
<a href="clientes.html" class="">Clientes</a>
<a href="productos.html" class="active">Productos</a>
<a href="categorias.html" class="">Categorías</a>
<a href="ventas.html" class="">Ventas</a>
      </nav>
    </aside>
    <main class="main">
      <header class="page-header">
  <h1>Productos</h1>
  <p>CRUD completo y ejemplo de clave foránea con categorías.</p>
</header>

<section class="panel">
  <h2 id="formTitle">Registrar producto</h2>
  <div id="mensaje" class="message"></div>
  <form id="productoForm">
    <input type="hidden" id="id_producto">
    <div class="form-grid">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" required>
      </div>
      <div class="field">
        <label for="precio">Precio</label>
        <input id="precio" type="number" min="0" step="0.01" required>
      </div>
      <div class="field">
        <label for="stock">Stock</label>
        <input id="stock" type="number" min="0" required>
      </div>
      <div class="field">
        <label for="id_categoria">Categoría</label>
        <select id="id_categoria" required></select>
      </div>
    </div>
    <div class="actions">
      <button class="btn-primary" type="submit">Guardar</button>
      <button class="btn-secondary" type="button" id="cancelarEdicion">Cancelar edición</button>
    </div>
  </form>
</section>

<section class="panel" style="margin-top:18px">
  <h2>Listado de productos</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ID</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
      </thead>
      <tbody id="productosBody"></tbody>
    </table>
  </div>
</section>
    </main>
  </div>
  <script src="js/productos.js"></script>
</body>
</html>
