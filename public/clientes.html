<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes | Sistema de Ventas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Sistema de Ventas</div>
      <nav class="nav">
        <a href="index.html" class="">Inicio</a>
<a href="clientes.html" class="active">Clientes</a>
<a href="productos.html" class="">Productos</a>
<a href="categorias.html" class="">Categorías</a>
<a href="ventas.html" class="">Ventas</a>
      </nav>
    </aside>
    <main class="main">
      <header class="page-header">
  <h1>Clientes</h1>
  <p>CRUD de clientes como ejercicio de transferencia del patrón aprendido.</p>
</header>

<section class="panel">
  <h2 id="formTitle">Registrar cliente</h2>
  <div id="mensaje" class="message"></div>
  <form id="clienteForm">
    <input type="hidden" id="id_cliente">
    <div class="form-grid">
      <div class="field"><label for="nombre">Nombre</label><input id="nombre" required></div>
      <div class="field"><label for="apellido">Apellido</label><input id="apellido" required></div>
      <div class="field"><label for="correo">Correo</label><input id="correo" type="email" required></div>
      <div class="field"><label for="telefono">Teléfono</label><input id="telefono"></div>
    </div>
    <div class="actions">
      <button class="btn-primary" type="submit">Guardar</button>
      <button class="btn-secondary" type="button" id="cancelarEdicion">Cancelar edición</button>
    </div>
  </form>
</section>

<section class="panel" style="margin-top:18px">
  <h2>Listado de clientes</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr></thead>
      <tbody id="clientesBody"></tbody>
    </table>
  </div>
</section>
    </main>
  </div>
  <script src="js/clientes.js"></script>
</body>
</html>
